<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trening" />
  <title>Trening</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            // ink-skalaen er nå designet for mørk modus:
            // lave tall = elevert overflate, høye tall = lys tekst
            ink: {
              50:  '#15151a',  // subtil bg (set-rader, etc)
              100: '#1c1c21',  // kort-overflate
              200: '#27272f',  // border / segmentert kontroll bg
              300: '#3f3f48',  // sterk border / disabled
              400: '#71717a',  // muted tekst
              500: '#a1a1aa',  // sekundær tekst
              600: '#d4d4d8',  // body
              700: '#e4e4e7',  // emfasert
              800: '#f4f4f5',  // overskrifter
              900: '#fafafa',  // primær tekst
              950: '#ffffff',  // ren hvit
            },
            // App-canvas (dypere enn kortene)
            canvas: '#0a0a0c',
            // Aksentfarge — sportslig lime
            accent: {
              DEFAULT: '#a3e635',
              hover:   '#bef264',
              fg:      '#0a0a0a',
            },
          },
          boxShadow: {
            // Subtil opphevning på mørke kort
            'card': '0 1px 0 0 rgba(255,255,255,0.04) inset, 0 1px 3px 0 rgba(0,0,0,0.5)',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-canvas text-ink-900 antialiased">
  <div id="app"></div>
  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
